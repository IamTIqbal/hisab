name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Dummy values only: the build never connects to a database or mail server,
    # so forks without any secrets configured still pass.
    env:
      TURSO_DATABASE_URL: file:./storage/ci.sqlite
      SESSION_SECRET: ci-only-dummy-secret-0123456789abcdef0123456789
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
