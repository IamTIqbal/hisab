name: Feature request
description: Suggest something Hisab should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in your way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: markdown
    attributes:
      value: Hisab is deliberately single-person per install. Requests for multiple users on one install are out of scope.
