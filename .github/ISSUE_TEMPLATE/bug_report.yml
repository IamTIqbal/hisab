name: Bug report
description: Something in Hisab doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste tokens, passwords, account numbers or real balances.**
        Security problems go through [SECURITY.md](../blob/main/SECURITY.md), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Expenses
        2. Add an expense of 500 from Cash
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hisab version
      description: From package.json, or the commit you deployed.
      placeholder: 1.0.0-beta.1
  - type: dropdown
    id: where
    attributes:
      label: Where it runs
      options:
        - Vercel + Turso
        - Local (npm run dev)
        - Other hosting
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: Android 14, Chrome 131, installed app
  - type: textarea
    id: logs
    attributes:
      label: Error message or log
      description: From the screen or the Vercel log. Remove anything private first.
      render: text
